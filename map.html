<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map - Pine City Zoo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header">
    <img src="images/logo.png" alt="Pine City Zoo">
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="animals.html">Animals</a>
      <a href="places.html">Places</a>
      <a href="map.html" class="active">Map</a>
      <a href="weather.html">Weather</a>
      <a href="feedback.html">Feedback</a>
    </nav>
  </div>

  <div class="page-header">
    <h1>Zoo Map</h1>
    <p>Find your way around Pine City Zoo</p>
  </div>

  <div class="content">
    <div class="map-container">
      <img src="images/map.png" alt="Zoo Map" class="zoo-map">
    </div>

    <div class="map-legend">
      <h3>Legend</h3>
      <div class="legend-items">
        <div class="legend-item">
          <span class="dot animals-dot"></span>
          <span>Animal Exhibits</span>
        </div>
        <div class="legend-item">
          <span class="dot food-dot"></span>
          <span>Restaurants & Cafes</span>
        </div>
        <div class="legend-item">
          <span class="dot attr-dot"></span>
          <span>Attractions</span>
        </div>
        <div class="legend-item">
          <span class="dot parking-dot"></span>
          <span>Parking</span>
        </div>
      </div>
    </div>

    <div class="quick-links">
      <h3>Quick Navigation</h3>
      <div class="link-buttons">
        <a href="animals.html" class="nav-btn">View Animals</a>
        <a href="places.html" class="nav-btn">Places to Eat</a>
        <a href="weather.html" class="nav-btn">Check Weather</a>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Pine City Zoo. All rights reserved.</p>
  </footer>
</body>
</html>
